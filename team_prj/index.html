<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서버 예약 시스템 — 시뮬레이션</title>
<style>
/* ── Reset & Base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #263249;
  --border: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-xdim: #475569;
  --accent: #3b82f6;
  --accent-dim: #1d4ed8;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --purple: #a855f7;
  --cyan: #06b6d4;

  --stu-color: #3b82f6;
  --mgr-color: #a855f7;
  --adm-color: #f59e0b;
  --sys-color: #06b6d4;

  --avail: #22c55e;
  --reserved: #f59e0b;
  --inuse: #3b82f6;
  --maintenance: #94a3b8;
  --quota-color: #10b981;

  font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}
body { min-height: 100vh; display: flex; flex-direction: column; }

/* ── Header ───────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
header .subtitle { font-size: 12px; color: var(--text-dim); }

/* ── Scenario Selector ────────────────────────────────── */
.scenario-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.scenario-bar label { font-size: 12px; color: var(--text-dim); margin-right: 4px; }
.scen-btn {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.scen-btn:hover { border-color: var(--accent); color: var(--text); }
.scen-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Controls ─────────────────────────────────────────── */
.controls {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.ctrl-btn {
  padding: 5px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background .15s;
  display: flex; align-items: center; gap: 5px;
}
.ctrl-btn:hover { background: var(--border); }
.ctrl-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ctrl-btn.primary:hover { background: var(--accent-dim); }
.ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.step-indicator {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: auto;
}
/* ── Main Layout ──────────────────────────────────────── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 200px 1fr 220px;
  grid-template-rows: 1fr 200px;
  gap: 0;
  overflow: hidden;
  min-height: 0;
}

/* ── Panel shared ─────────────────────────────────────── */
.panel {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-xdim);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

/* ── Actors Panel (left) ──────────────────────────────── */
.actors-panel {
  grid-row: 1 / 2;
  grid-column: 1 / 2;
}
.actor-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.actor-card {
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: all .2s;
  background: var(--surface);
}
.actor-card.active-actor {
  border-color: var(--actor-color, var(--accent));
  box-shadow: 0 0 0 2px var(--actor-color, var(--accent))30,
              0 0 14px var(--actor-color, var(--accent))20;
}
.actor-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  background: var(--actor-color, var(--accent))22;
  border: 1.5px solid var(--actor-color, var(--accent))66;
}
.actor-info { flex: 1; min-width: 0; }
.actor-name { font-size: 14px; font-weight: 700; }
.actor-role { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.3; }
.actor-quota {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-dim);
}
.quota-bar {
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  margin-top: 4px;
  overflow: hidden;
}
.quota-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--quota-color);
  transition: width .4s ease;
}
.quota-fill.low { background: var(--yellow); }
.quota-fill.critical { background: var(--red); }
.actor-notify {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--red);
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  display: none;
  align-items: center; justify-content: center;
  flex-shrink: 0;
}
.actor-notify.show { display: flex; }

/* ── Stage (center) ───────────────────────────────────── */
.stage-panel {
  grid-row: 1 / 2;
  grid-column: 2 / 3;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.stage-canvas {
  width: 100%; height: 100%;
  position: relative;
  overflow: hidden;
}

/* SVG overlay for arrows */
.stage-svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* ── Flow Lanes ───────────────────────────────────────── */
.lanes {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 16px 20px;
  gap: 12px;
}
.lane {
  display: flex;
  align-items: center;
  gap: 0;
  position: relative;
  height: 56px;
  flex-shrink: 0;
}
.lane-label {
  width: 80px;
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--lane-color, var(--text-dim));
}
.lane-line {
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--lane-color, var(--border)) 0%, transparent 100%);
  position: relative;
}

/* ── Message Bubble ───────────────────────────────────── */
.msg-bubble {
  position: absolute;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  white-space: nowrap;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  max-width: 240px;
  white-space: normal;
  line-height: 1.5;
}
.msg-bubble.visible { opacity: 1; }
.msg-bubble.msg-stu { border-color: var(--stu-color)80; color: var(--text); }
.msg-bubble.msg-mgr { border-color: var(--mgr-color)80; }
.msg-bubble.msg-adm { border-color: var(--adm-color)80; }
.msg-bubble.msg-sys { border-color: var(--sys-color)80; }
.msg-bubble.msg-success { border-color: var(--green)80; }
.msg-bubble.msg-error { border-color: var(--red)80; }
.msg-bubble.msg-warn { border-color: var(--yellow)80; }

/* ── Animated Arrow ───────────────────────────────────── */
.arrow-path {
  stroke-dasharray: 8 4;
  stroke-dashoffset: 0;
  animation: dashMove .6s linear infinite;
  fill: none;
  stroke-width: 2;
}
@keyframes dashMove {
  to { stroke-dashoffset: -12; }
}

/* ── Servers Panel (right) ────────────────────────────── */
.servers-panel {
  grid-row: 1 / 2;
  grid-column: 3 / 4;
  border-right: none;
}
.server-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.server-card {
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 10px 12px;
  background: var(--surface);
  transition: all .3s;
  cursor: default;
}
.server-card.highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent)30;
}
.server-card.pulse {
  animation: serverPulse .6s ease 3;
}
@keyframes serverPulse {
  0%,100% { box-shadow: none; }
  50% { box-shadow: 0 0 0 4px var(--accent)40; }
}
.server-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.server-name { font-size: 14px; font-weight: 700; }
.server-spec { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.server-owner { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
.status-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
  letter-spacing: .3px;
  flex-shrink: 0;
}
.status-AVAILABLE { background: var(--avail)20; color: var(--avail); border: 1px solid var(--avail)40; }
.status-RESERVED { background: var(--reserved)20; color: var(--reserved); border: 1px solid var(--reserved)40; }
.status-IN_USE { background: var(--inuse)20; color: var(--inuse); border: 1px solid var(--inuse)40; }
.status-MAINTENANCE { background: var(--maintenance)20; color: var(--maintenance); border: 1px solid var(--maintenance)40; }
.server-progress {
  margin-top: 6px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.server-progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--inuse);
  transition: width .5s ease;
}

/* ── Log Panel (bottom) ───────────────────────────────── */
.log-panel {
  grid-row: 2 / 3;
  grid-column: 1 / 4;
  border-top: 1px solid var(--border);
  border-right: none;
  display: flex;
  flex-direction: column;
  background: var(--surface);
}
.log-header {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-xdim);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.log-clear {
  margin-left: auto;
  padding: 2px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}
.log-clear:hover { background: var(--border); }
.log-entries {
  flex: 1;
  overflow-y: auto;
  padding: 8px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}
.log-entry {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 13px;
  line-height: 1.5;
  padding: 5px 0;
  border-bottom: 1px solid var(--border)60;
}
.log-entry:last-child { border-bottom: none; }
.log-time { font-size: 12px; color: var(--text-xdim); flex-shrink: 0; font-variant-numeric: tabular-nums; min-width: 36px; }
.log-step { font-size: 12px; font-weight: 700; flex-shrink: 0; min-width: 52px; }
.log-step.stu { color: var(--stu-color); }
.log-step.mgr { color: var(--mgr-color); }
.log-step.adm { color: var(--adm-color); }
.log-step.sys { color: var(--sys-color); }
.log-step.system { color: var(--text-dim); }
.log-msg { color: var(--text); flex: 1; font-size: 13px; }
.log-msg.success { color: var(--green); }
.log-msg.error { color: var(--red); }
.log-msg.warn { color: var(--yellow); }
.log-msg.info { color: var(--cyan); }
.log-uc { font-size: 11px; color: var(--text-xdim); flex-shrink: 0; }

/* ── Flow Diagram (center stage) ─────────────────────── */
.flow-area {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.flow-diagram {
  width: calc(100% - 32px);
  height: calc(100% - 32px);
  position: relative;
}
.flow-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ── Step Boxes ───────────────────────────────────────── */
.step-box {
  position: absolute;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11px;
  line-height: 1.4;
  border: 1px solid var(--border);
  background: var(--surface2);
  transition: all .3s;
  max-width: 180px;
  text-align: center;
  pointer-events: none;
  opacity: 0.35;
}
.step-box.current {
  opacity: 1;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent)30, 0 4px 20px #0006;
}
.step-box.done {
  opacity: 0.7;
  border-color: var(--green)60;
}
.step-box.error {
  border-color: var(--red)80;
  opacity: 1;
}
.step-box.warn {
  border-color: var(--yellow)80;
  opacity: 1;
}
.step-num {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--border);
  line-height: 16px;
  text-align: center;
  margin-right: 4px;
}
.step-box.current .step-num { background: var(--accent); }
.step-box.done .step-num { background: var(--green); }

/* ── Scenario description ─────────────────────────────── */
.scenario-desc {
  padding: 8px 16px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}
.scenario-desc strong { color: var(--text); }

/* ── Connection lines ─────────────────────────────────── */
.conn-line {
  stroke: var(--border);
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
  fill: none;
}
.conn-line.active {
  stroke: var(--accent);
  stroke-dasharray: 6 3;
  animation: dashMove .5s linear infinite;
}
.conn-line.success { stroke: var(--green); }
.conn-line.error { stroke: var(--red); }
.conn-line.warn { stroke: var(--yellow); }

/* ── Actor nodes in flow ──────────────────────────────── */
.flow-actor {
  position: absolute;
  width: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.flow-actor-icon {
  width: 50px; height: 50px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  border: 2px solid var(--actor-color, var(--border));
  background: var(--actor-color, var(--border))15;
  transition: all .3s;
}
.flow-actor.active-flow .flow-actor-icon {
  box-shadow: 0 0 0 4px var(--actor-color, var(--accent))30;
  animation: actorPulse .8s ease infinite;
}
@keyframes actorPulse {
  0%,100% { box-shadow: 0 0 0 3px var(--actor-color)30; }
  50% { box-shadow: 0 0 0 7px var(--actor-color)15; }
}
.flow-actor-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--actor-color, var(--text-dim));
  text-align: center;
}

/* ── System box in flow ───────────────────────────────── */
.flow-system {
  position: absolute;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  padding: 8px 12px;
  text-align: center;
  transition: all .3s;
}
.flow-system.active-system {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent)20;
}
.flow-system-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
}
.flow-system-sub {
  font-size: 9px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ── Notification toast ───────────────────────────────── */
.toast-container {
  position: fixed;
  top: 60px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  min-width: 220px;
  max-width: 300px;
  box-shadow: 0 4px 20px #0006;
  animation: toastIn .2s ease;
  line-height: 1.5;
}
.toast.success { border-color: var(--green)80; }
.toast.error { border-color: var(--red)80; }
.toast.warn { border-color: var(--yellow)80; }
.toast.info { border-color: var(--cyan)80; }
@keyframes toastIn {
  from { transform: translateX(20px); opacity: 0; }
  to { transform: none; opacity: 1; }
}
.toast-title { font-weight: 700; margin-bottom: 3px; font-size: 13px; }
.toast-title.success { color: var(--green); }
.toast-title.error { color: var(--red); }
.toast-title.warn { color: var(--yellow); }
.toast-title.info { color: var(--cyan); }

/* ── Progress bar ─────────────────────────────────────── */
.progress-track {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: visible;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .3s ease;
}

/* ── Scrollbars ───────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── System Component Cards ───────────────────────────── */
.comp-card {
  position: absolute;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all .25s;
  pointer-events: none;
  min-width: 0;
}
.comp-card-icon { font-size: 28px; flex-shrink: 0; }
.comp-card-info { min-width: 0; }
.comp-card-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.comp-card-sub {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 3px;
  white-space: nowrap;
}
.comp-card.comp-active {
  border-color: var(--comp-color, var(--accent));
  background: color-mix(in srgb, var(--comp-color, var(--accent)) 12%, var(--surface));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--comp-color, var(--accent)) 30%, transparent),
              0 0 16px color-mix(in srgb, var(--comp-color, var(--accent)) 20%, transparent);
}
.comp-card.comp-active .comp-card-name {
  color: var(--comp-color, var(--accent));
}

/* ── Utility ──────────────────────────────────────────── */
.hidden { display: none !important; }
.tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
}
</style>
</head>
<body>

<header>
  <h1>서버 예약/할당 관리 시스템</h1>
  <span class="subtitle">유스케이스 인터랙션 시뮬레이터</span>
</header>

<div class="scenario-bar">
  <label>시나리오</label>
  <button class="scen-btn active" data-scen="A">A. 정상 예약</button>
  <button class="scen-btn" data-scen="B">B. Quota 초과 → 승인</button>
  <button class="scen-btn" data-scen="C">C. 동시 충돌</button>
  <button class="scen-btn" data-scen="D">D. 유휴 자동 회수</button>
  <button class="scen-btn" data-scen="E">E. 만료 자동 반납</button>
  <button class="scen-btn" data-scen="F">F. 타임아웃 자동 거절</button>
  <button class="scen-btn" data-scen="G">G. 예약 취소</button>
  <button class="scen-btn" data-scen="H">H. MGR 명시적 거절</button>
  <button class="scen-btn" data-scen="I">I. 서버 점검 등록</button>
  <button class="scen-btn" data-scen="J">J. Quota 상향 조정</button>
  <button class="scen-btn" data-scen="K">K. 이상 징후 탐지</button>
  <button class="scen-btn" data-scen="L">L. 건강 점수 산출</button>
  <button class="scen-btn" data-scen="M">M. 비정상 접근 잠금</button>
  <button class="scen-btn" data-scen="N">N. 운영 대시보드</button>
</div>

// ═══════════════════════════════════════════════════════
// RENDER ACTORS
// ═══════════════════════════════════════════════════════
function renderActors() {
  const scen = SCENARIOS[currentScen];
  const visibleActors = scen.actors;
  actorListEl.innerHTML = '';
  for (const [code, a] of Object.entries(state.actors)) {
    if (!visibleActors.includes(code)) continue;
    const quotaRatio = a.quotaMax ? (a.quotaUsed / a.quotaMax) : null;
    const fillClass = quotaRatio > 0.8 ? 'critical' : quotaRatio > 0.5 ? 'low' : '';
    const div = document.createElement('div');
    div.className = 'actor-card';
    div.id = `actor-${code}`;
    div.style.setProperty('--actor-color', a.color);
    div.innerHTML = `
      <div class="actor-icon">${a.emoji}</div>
      <div class="actor-info">
        <div class="actor-name">${a.name}</div>
        <div class="actor-role">${a.role}</div>
        ${a.quotaMax != null ? `
        <div class="actor-quota">
          Quota: ${a.quotaUsed} / ${a.quotaMax}
          <div class="quota-bar"><div class="quota-fill ${fillClass}" style="width:${quotaRatio*100}%"></div></div>
        </div>` : ''}
      </div>
      <div class="actor-notify ${a.notify > 0 ? 'show' : ''}" id="notify-${code}">${a.notify}</div>
    `;
    actorListEl.appendChild(div);
  }
}

// ═══════════════════════════════════════════════════════
// RENDER SERVERS
// ═══════════════════════════════════════════════════════
function renderServers() {
  serverListEl.innerHTML = '';
  for (const srv of state.servers) {
    const div = document.createElement('div');
    div.className = 'server-card';
    div.id = `server-${srv.id}`;
    div.innerHTML = `
      <div class="server-top">
        <div>
          <div class="server-name">${srv.name}</div>
          <div class="server-spec">${srv.spec}</div>
        </div>
        <span class="status-badge status-${srv.status}">${srv.status}</span>
      </div>
      ${srv.owner ? `<div class="server-owner">점유: ${srv.owner}</div>` : '<div class="server-owner" style="color:var(--text-xdim)">미사용</div>'}
      ${srv.status === 'IN_USE' ? `
      <div class="server-progress">
        <div class="server-progress-fill" style="width:${srv.usage}%"></div>
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:3px;">CPU 사용률 ${srv.usage}%</div>
      ` : ''}
    `;
    serverListEl.appendChild(div);
  }
}

// ═══════════════════════════════════════════════════════
// FLOW DIAGRAM
// ═══════════════════════════════════════════════════════
const FLOW_POSITIONS = {};
const COMP_POSITIONS = {};

// component definitions: key → { icon, name, sub, color }
const COMP_DEFS = {
  reservation: { icon:'🗓', name:'예약 서비스',     sub:'UC04~07',  color:'var(--accent)' },
  quota:       { icon:'📊', name:'Quota 관리자',    sub:'UC09~10',  color:'var(--purple)' },
  approval:    { icon:'✅', name:'승인 서비스',     sub:'UC09',     color:'var(--green)' },
  notification:{ icon:'🔔', name:'알림 서비스',     sub:'UC03',     color:'var(--yellow)' },
  monitoring:  { icon:'📡', name:'모니터링 에이전트', sub:'UC14~19', color:'var(--cyan)' },
  security:    { icon:'🔒', name:'보안 서비스',     sub:'UC20',     color:'var(--red)' },
  dashboard:   { icon:'🖥', name:'운영 대시보드',   sub:'UC21',     color:'var(--text-dim)' },
  db:          { icon:'🗄', name:'DB',              sub:'Reservation·Quota·ApprovalRequest', color:'var(--text-dim)' },
};

function buildFlowLayout() {
  flowActorsEl.innerHTML = '';
  flowSvg.innerHTML = '';
  const scen = SCENARIOS[currentScen];
  const rect = flowDiagram.getBoundingClientRect();
  const W = rect.width || 600;
  const H = rect.height || 500;

  const actors = scen.actors;
  const leftX = 10;
  const actorW = 68;
  const sysBoxX = leftX + actorW + 14;
  const sysBoxW = W - sysBoxX - 10;
  const sysBoxY = 10;
  const sysBoxH = H - 20;

  // ── System outer box ──────────────────────────────────
  const sysRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  sysRect.setAttribute('x', sysBoxX); sysRect.setAttribute('y', sysBoxY);
  sysRect.setAttribute('width', sysBoxW); sysRect.setAttribute('height', sysBoxH);
  sysRect.setAttribute('rx', '12');
  sysRect.setAttribute('fill', 'none');
  sysRect.setAttribute('stroke', 'var(--border)');
  sysRect.setAttribute('stroke-width', '1.5');
  sysRect.setAttribute('stroke-dasharray', '8 5');
  flowSvg.appendChild(sysRect);

  const sysLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  sysLabel.setAttribute('x', sysBoxX + 12); sysLabel.setAttribute('y', sysBoxY + 16);
  sysLabel.setAttribute('fill', 'var(--text-xdim)');
  sysLabel.setAttribute('font-size', '12');
  sysLabel.setAttribute('font-weight', '700');
  sysLabel.setAttribute('letter-spacing', '0.8');
  sysLabel.textContent = '서버 예약 시스템';
  flowSvg.appendChild(sysLabel);

  // ── Component cards (2-column grid inside system box) ─
  const comps = Object.entries(COMP_DEFS);
  const cols = 2;
  const rows = Math.ceil(comps.length / cols);
  const innerX = sysBoxX + 14;
  const innerY = sysBoxY + 26;
  const innerW = sysBoxW - 28;
  const innerH = sysBoxH - 36;
  const compW = (innerW - 10) / cols;
  const compH = (innerH - (rows - 1) * 10) / rows;

  comps.forEach(([key, def], idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const cx = innerX + col * (compW + 10);
    const cy = innerY + row * (compH + 10);
    const ccx = cx + compW / 2;
    const ccy = cy + compH / 2;

    const el = document.createElement('div');
    el.className = 'comp-card';
    el.id = `comp-${key}`;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.width = compW + 'px';
    el.style.height = compH + 'px';
    el.style.setProperty('--comp-color', def.color);
    el.innerHTML = `
      <div class="comp-card-icon">${def.icon}</div>
      <div class="comp-card-info">
        <div class="comp-card-name">${def.name}</div>
        <div class="comp-card-sub">${def.sub}</div>
      </div>`;
    flowActorsEl.appendChild(el);
    COMP_POSITIONS[key] = { x: ccx, y: ccy };
  });

  // ── Actor lane lines ──────────────────────────────────
  const laneYStep = (H - 40) / Math.max(actors.length, 1);
  actors.forEach((code, i) => {
    const a = INITIAL_STATE().actors[code];
    const y = 20 + i * laneYStep + laneYStep / 2;

    const lane = document.createElementNS('http://www.w3.org/2000/svg','line');
    lane.setAttribute('x1', leftX + actorW - 2); lane.setAttribute('y1', y);
    lane.setAttribute('x2', sysBoxX); lane.setAttribute('y2', y);
    lane.setAttribute('stroke', 'var(--border)');
    lane.setAttribute('stroke-width', '1');
    lane.setAttribute('stroke-dasharray', '3 3');
    lane.setAttribute('opacity', '0.35');
    flowSvg.appendChild(lane);

    const div = document.createElement('div');
    div.className = 'flow-actor';
    div.id = `flow-actor-${code}`;
    div.style.left = leftX + 'px';
    div.style.top = (y - 30) + 'px';
    div.style.setProperty('--actor-color', a.color);
    div.innerHTML = `<div class="flow-actor-icon">${a.emoji}</div><div class="flow-actor-name">${code}</div>`;
    flowActorsEl.appendChild(div);
    FLOW_POSITIONS[code] = { x: leftX + actorW / 2, y };
  });
}

// ═══════════════════════════════════════════════════════
// ANIMATE ARROW
// ═══════════════════════════════════════════════════════
let arrowEls = [];
function clearArrows() {
  arrowEls.forEach(e => e.remove());
  arrowEls = [];
  flowMsgsEl.innerHTML = '';
  document.querySelectorAll('.comp-card').forEach(el => el.classList.remove('comp-active'));
}

function animateArrow(fromCode, toCode, msg, type, comp) {
  clearArrows();
  const rect = flowDiagram.getBoundingClientRect();
  const W = rect.width || 600;
  const H = rect.height || 500;
  const actorW = 68;
  const sysBoxX = 10 + actorW + 14;

  // resolve `from`
  let from = FLOW_POSITIONS[fromCode];
  if (!from) {
    // actor is inside system box — use first comp or center
    const firstComp = comp ? comp.split(',')[0].trim() : null;
    from = (firstComp && COMP_POSITIONS[firstComp]) || { x: sysBoxX + (W - sysBoxX) / 2, y: H / 2 };
  }

  // resolve `to`
  let to;
  if (toCode && FLOW_POSITIONS[toCode]) {
    to = FLOW_POSITIONS[toCode];
  } else if (comp) {
    // point to the PRIMARY comp (first in list that has a position)
    const keys = comp.split(',').map(k => k.trim());
    to = keys.map(k => COMP_POSITIONS[k]).find(Boolean) || { x: sysBoxX + (W - sysBoxX) / 2, y: H / 2 };
  } else {
    to = { x: sysBoxX + (W - sysBoxX) / 2, y: H / 2 };
  }

  // color by type
  const colorMap = {
    stu:'var(--stu-color)', mgr:'var(--mgr-color)',
    adm:'var(--adm-color)', sys:'var(--sys-color)',
    success:'var(--green)', error:'var(--red)', warn:'var(--yellow)', info:'var(--cyan)'
  };
  const color = colorMap[type] || 'var(--accent)';

  // SVG arrow
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  const mx = (from.x + to.x)/2;
  const d = `M${from.x},${from.y} Q${mx},${Math.min(from.y, to.y) - 30} ${to.x},${to.y}`;
  path.setAttribute('d', d);
  path.setAttribute('class', 'arrow-path');
  path.setAttribute('stroke', color);

  // arrowhead
  const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
  const mid = `marker-${Date.now()}`;
  marker.setAttribute('id', mid);
  marker.setAttribute('markerWidth','8'); marker.setAttribute('markerHeight','8');
  marker.setAttribute('refX','6'); marker.setAttribute('refY','3');
  marker.setAttribute('orient','auto');
  const mpath = document.createElementNS('http://www.w3.org/2000/svg','path');
  mpath.setAttribute('d','M0,0 L0,6 L8,3 z');
  mpath.setAttribute('fill', color);
  marker.appendChild(mpath);
  let defs = flowSvg.querySelector('defs');
  if (!defs) { defs = document.createElementNS('http://www.w3.org/2000/svg','defs'); flowSvg.prepend(defs); }
  defs.appendChild(marker);
  path.setAttribute('marker-end', `url(#${mid})`);
  flowSvg.appendChild(path);
  arrowEls.push(path);

  // Message label
  if (msg) {
    const bubble = document.createElement('div');
    bubble.className = `msg-bubble msg-${type} visible`;
    bubble.innerHTML = msg.replace(/\n/g,'<br>');
    const bx = (from.x + to.x)/2 - 90;
    const by = Math.min(from.y, to.y) - 60;
    bubble.style.left = Math.max(4, bx) + 'px';
    bubble.style.top = Math.max(4, by) + 'px';
    flowMsgsEl.appendChild(bubble);
    arrowEls.push(bubble);
  }
}

// ═══════════════════════════════════════════════════════
// HIGHLIGHT ACTORS
// ═══════════════════════════════════════════════════════
function highlightActors(fromCode, toCode) {
  document.querySelectorAll('.actor-card').forEach(el => el.classList.remove('active-actor'));
  document.querySelectorAll('.flow-actor').forEach(el => el.classList.remove('active-flow'));
  [fromCode, toCode].filter(Boolean).forEach(code => {
    const card = document.getElementById(`actor-${code}`);
    if (card) card.classList.add('active-actor');
    const flow = document.getElementById(`flow-actor-${code}`);
    if (flow) flow.classList.add('active-flow');
  });
}

// ═══════════════════════════════════════════════════════
// HIGHLIGHT COMPONENTS
// ═══════════════════════════════════════════════════════
function highlightComponents(comp) {
  document.querySelectorAll('.comp-card').forEach(el => el.classList.remove('comp-active'));
  if (!comp) return;
  comp.split(',').map(k => k.trim()).forEach(key => {
    const el = document.getElementById(`comp-${key}`);
    if (el) el.classList.add('comp-active');
  });
}

// ═══════════════════════════════════════════════════════
// APPLY STEP
// ═══════════════════════════════════════════════════════
function applyStep(step) {
  // server update
  if (step.serverUpdate) {
    const srv = state.servers.find(s => s.id === step.serverUpdate.id);
    if (srv) Object.assign(srv, step.serverUpdate);
    renderServers();
    if (step.serverUpdate.id) {
      const el = document.getElementById(`server-${step.serverUpdate.id}`);
      if (el) { el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 2000); }
    }
  }
  if (step.serverHighlight) {
    const el = document.getElementById(`server-${step.serverHighlight}`);
    if (el) { el.classList.add('highlight'); setTimeout(() => el.classList.remove('highlight'), 2000); }
  }

  // quota update
  if (step.quotaUpdate) {
    const a = state.actors[step.quotaUpdate.actor];
    if (a) a.quotaUsed = step.quotaUpdate.used;
    renderActors();
  }
  if (step.quotaMaxUpdate) {
    const a = state.actors[step.quotaMaxUpdate.actor];
    if (a) a.quotaMax = step.quotaMaxUpdate.max;
    renderActors();
  }

  // notify update
  [step.notifyUpdate, step.notifyUpdate2].filter(Boolean).forEach(nu => {
    const a = state.actors[nu.actor];
    if (a) {
      a.notify = Math.max(0, (a.notify || 0) + nu.delta);
      const el = document.getElementById(`notify-${nu.actor}`);
      if (el) {
        el.textContent = a.notify;
        el.classList.toggle('show', a.notify > 0);
      }
    }
  });

  // toast
  if (step.toast) showToast(step.toast.type, step.toast.title, step.toast.msg);

  // arrow + component highlight
  animateArrow(step.actor, step.target, step.msg, step.type, step.comp);
  highlightActors(step.actor, step.target);
  highlightComponents(step.comp || null);

  // log
  addLog(step);

  // step indicator
  const steps = SCENARIOS[currentScen].steps;
  stepIndicator.textContent = `스텝 ${stepIndex + 1} / ${steps.length}`;
  progressFill.style.width = `${((stepIndex + 1) / steps.length) * 100}%`;
  btnPrev.disabled = stepIndex <= 0;
  btnNext.disabled = stepIndex >= steps.length - 1;
}

// ═══════════════════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════════════════
function addLog(step) {
  simTime += 1;
  const actorClassMap = { STU:'stu', STU2:'stu', MGR:'mgr', ADM:'adm', SYS:'sys' };
  const cls = actorClassMap[step.actor] || 'system';
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <span class="log-time">T+${simTime}</span>
    <span class="log-step ${cls}">${step.actor}</span>
    <span class="log-msg ${step.logType || ''}">${step.log}</span>
    <span class="log-uc">${step.uc}</span>
  `;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function showToast(type, title, msg) {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div class="toast-title ${type}">${title}</div>${msg.replace(/\n/g,'<br>')}`;
  toastContainer.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 400); }, 3000);
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function nextStep() {
  const steps = SCENARIOS[currentScen].steps;
  if (stepIndex >= steps.length - 1) return;
  stepIndex++;
  applyStep(steps[stepIndex]);
}

function prevStep() {
  if (stepIndex <= 0) return;
  const targetIndex = stepIndex - 1;
  // reset JS state and replay mutations up to targetIndex
  resetState();
  const steps = SCENARIOS[currentScen].steps;
  for (let i = 0; i <= targetIndex; i++) {
    const s = steps[i];
    if (s.serverUpdate) { const srv = state.servers.find(v => v.id === s.serverUpdate.id); if (srv) Object.assign(srv, s.serverUpdate); }
    if (s.quotaUpdate) { const a = state.actors[s.quotaUpdate.actor]; if (a) a.quotaUsed = s.quotaUpdate.used; }
    if (s.quotaMaxUpdate) { const a = state.actors[s.quotaMaxUpdate.actor]; if (a) a.quotaMax = s.quotaMaxUpdate.max; }
    [s.notifyUpdate, s.notifyUpdate2].filter(Boolean).forEach(nu => { const a = state.actors[nu.actor]; if (a) a.notify = Math.max(0, (a.notify || 0) + nu.delta); });
  }
  stepIndex = targetIndex;
  // trim log to matching number of entries
  const entries = logEl.querySelectorAll('.log-entry');
  entries.forEach((el, i) => { if (i > stepIndex) el.remove(); });
  simTime = stepIndex + 1;
  renderActors(); renderServers();
  const s = steps[stepIndex];
  animateArrow(s.actor, s.target, s.msg, s.type, s.comp);
  highlightActors(s.actor, s.target);
  highlightComponents(s.comp || null);
  btnPrev.disabled = stepIndex <= 0;
  btnNext.disabled = stepIndex >= steps.length - 1;
  progressFill.style.width = `${((stepIndex + 1) / steps.length) * 100}%`;
  stepIndicator.textContent = `스텝 ${stepIndex + 1} / ${steps.length}`;
}


// ═══════════════════════════════════════════════════════
// SCENARIO SELECT
// ═══════════════════════════════════════════════════════
function selectScenario(code) {
  if (currentScen === code && stepIndex >= 0) return;
  currentScen = code;
  document.querySelectorAll('.scen-btn').forEach(b => b.classList.toggle('active', b.dataset.scen === code));
  resetSim();
}

function resetState() {
  state = INITIAL_STATE();
  const scen = SCENARIOS[currentScen];
  if (scen.setup) scen.setup(state);
}

function resetSim() {
  stepIndex = -1;
  simTime = 0;
  resetState();
  renderActors();
  renderServers();
  clearArrows();
  logEl.innerHTML = '';
  progressFill.style.width = '0%';
  stepIndicator.textContent = '—';
  btnPrev.disabled = true;
  btnNext.disabled = false;

  // scenario description
  const scen = SCENARIOS[currentScen];
  scenDescEl.classList.remove('hidden');
  scenDescEl.innerHTML = `<strong>${scen.title}</strong><br><span>${scen.desc}</span>`;

  // rebuild flow layout after DOM settle
  requestAnimationFrame(() => { buildFlowLayout(); });
}

// ═══════════════════════════════════════════════════════
// RESIZE — rebuild arrows
// ═══════════════════════════════════════════════════════
const ro = new ResizeObserver(() => {
  buildFlowLayout();
  clearArrows();
});
ro.observe(flowDiagram);

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
resetSim();
</script>
