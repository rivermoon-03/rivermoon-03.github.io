<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RIVERMOON">
  <!--
    PWA 설치 아이콘. 사이트 정체성(검은 바탕 + 호박색)을 그대로 쓴다.
